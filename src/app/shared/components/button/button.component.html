<button
  mat-raised-button
  [color]="color"
  [type]="type"
  class="button"
  [disabled]="disabled || loading"
  (click)="onClick()"
>
  @if (!loading) {
    <span class="button__content">
      @if (icon) {
        <mat-icon class="">{{ icon }}</mat-icon>
      }
      {{ label }}
    </span>
  } @else {
    <mat-spinner [diameter]="spinnerSize" />
  }
</button>
